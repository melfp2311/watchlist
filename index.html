async function loadFromGitHub(){
  try{ const r=await fetch('https://raw.githubusercontent.com/'+GITHUB_REPO+'/main/'+GITHUB_FILE+'?t='+Date.now());
    if(r.ok) return await r.json(); }catch(e){} return null;
}
async function pushToGitHub(data,token){
  try{
    const u='https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+GITHUB_FILE;
    const g=await fetch(u,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});
    let sha; if(g.ok){ const d=await g.json(); sha=d.sha; }
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    const body={message:'Update watchlist '+new Date().toISOString().slice(0,10),content};
    if(sha) body.sha=sha;
    const p=await fetch(u,{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    return p.ok;
  }catch(e){ return false; }
}

function Row({item, isWatched, onRate, onDelete, onDetail, isEditor}){
  const [sx,setSx]=React.useState(0); const tr=React.useRef(null);
  function ts(e){ tr.current=e.touches[0].clientX; }
  function tm(e){ if(tr.current===null)return; setSx(Math.max(-90,Math.min(90,e.touches[0].clientX-tr.current))); }
  function te(){ if(isEditor){ if(sx>65) onRate(item); else if(sx<-65&&confirm('¿Eliminar?')) onDelete(item.id); } setSx(0); tr.current=null; }
  const bg=sx>30?'rgba(109,40,217,'+(Math.min(sx/90,.7))+')':sx<-30?'rgba(185,28,28,'+(Math.min(-sx/90,.7))+')':\'transparent\';
  return (
    <div className="row relative overflow-hidden rounded-lg" style={{background:bg}} onTouchStart={ts} onTouchMove={tm} onTouchEnd={te}>
      {sx>30&&isEditor&&<span className="absolute left-3 top-1/2 -translate-y-1/2 text-white text-xs font-bold">{isWatched?\'✏️\':\'✓\'}</span>}
      {sx<-30&&isEditor&&<span className="absolute right-3 top-1/2 -translate-y-1/2 text-white text-xs font-bold">✕</span>}
      <div className="flex items-center gap-2 px-3 py-2" style={{transform:'translateX('+sx+'px)',transition:sx===0?'transform .2s':'none'}}>
      <button onClick={()=>onDetail(item)} className="flex-1 text-sm text-gray-200 min-w-0 truncate text-left hover:text-violet-300 transition-colors" title={item.title}>{item.title}</button>
      {item.genre && <GenreTag genre={item.genre}/>}
      {isWatched
        ? <span className="text-sm flex-shrink-0 min-w-[60px] text-right">{item.rating||<span className="text-gray-700 text-xs">—</span>}</span>
        : null
      }
      {isEditor&&<div className="actions flex gap-1 flex-shrink-0">
        <button
          onClick={()=>onRate(item)}
          className="text-xs text-violet-500 hover:text-violet-300 px-1.5 py-0.5 rounded hover:bg-violet-950"
        >{isWatched?'✏️':'✓'}</button>
        <button
          onClick={()=>{if(confirm('¿Eliminar "'+item.title+'"?')) onDelete(item.id);}}
          className="text-xs text-gray-700 hover:text-red-400 px-1.5 py-0.5 rounded hover:bg-red-950"
        >✕</button>
      </div>}
    </div>
  );
}

function cleanForSearch(title){
  return title
    .replace(/\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu,'')
    .replace(/\s*\([^)]*\)\s*/g,' ')
    .replace(/\s+/g,' ').trim();
}

function DetailPanel({item, isMovie, omdbKey, onClose}){
  const [info,setInfo]=useState(null);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState(false);
  const clean=cleanForSearch(item.title);
  const jwUrl=`https://www.justwatch.com/mx/buscar?q=${encodeURIComponent(clean)}`;
  const rtUrl=`https://www.rottentomatoes.com/search?search=${encodeURIComponent(clean)}`;

  useEffect(()=>{
    if(!omdbKey){setInfo(null);return;}
    setLoading(true);setErr(false);setInfo(null);
    fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(clean)}&apikey=${omdbKey}&tomatoes=true`)
      .then(r=>r.json())
      .then(d=>{ setLoading(false); if(d.Response==='True') setInfo(d); else setErr(true); })
      .catch(()=>{setLoading(false);setErr(true);});
  },[item.id, omdbKey]);

  const rtRating=info&&info.Ratings&&info.Ratings.find(r=>r.Source==='Rotten Tomatoes');

  return (
    <div className="modal-bg fixed inset-0 bg-black/70 flex items-end sm:items-center justify-center z-50 p-4" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box bg-gray-900 border border-gray-800 rounded-2xl p-5 w-full max-w-sm">
        <div className="flex items-start gap-3 mb-4">
          <div className="flex-1 min-w-0">
            <p className="font-bold text-white text-sm leading-snug">{item.title}</p>
            {info&&<p className="text-xs text-gray-500 mt-0.5">{info.Year} · {info.Runtime} · {info.Rated}</p>}
          </div>
          <button onClick={onClose} className="text-gray-600 hover:text-gray-400 flex-shrink-0 text-sm">✕</button>
        </div>

        {info&&(
          <div className="mb-4">
            {info.Poster&&info.Poster!=='N/A'&&(
              <img src={info.Poster} alt={info.Title} className="w-full h-48 object-cover rounded-xl mb-3" style={{objectPosition:'center top'}}/>
            )}
            {info.Plot&&info.Plot!=='N/A'&&<p className="text-xs text-gray-400 mb-3 leading-relaxed">{info.Plot}</p>}
            <div className="flex gap-3">
              {info.imdbRating&&info.imdbRating!=='N/A'&&(
                <div className="flex-1 bg-yellow-950 rounded-xl p-2 text-center">
                  <p className="text-yellow-400 font-bold text-lg">{info.imdbRating}</p>
                  <p className="text-yellow-700 text-xs">IMDb</p>
                </div>
              )}
              {rtRating&&(
                <div className="flex-1 bg-red-950 rounded-xl p-2 text-center">
                  <p className="text-red-400 font-bold text-lg">{rtRating.Value}</p>
                  <p className="text-red-700 text-xs">Rotten Tomatoes</p>
                </div>
              )}
            </div>
          </div>
        )}
        {loading&&<p className="text-xs text-gray-600 mb-4 text-center py-4">Buscando info…</p>}
        {err&&omdbKey&&<p className="text-xs text-gray-600 mb-4 text-center">No se encontró en OMDB</p>}
        {!omdbKey&&<p className="text-xs text-gray-700 mb-4 text-center">Agrega tu OMDB key en ajustes para ver ratings e info</p>}

          <a href={jwUrl} target="_blank" rel="noreferrer"
            className="flex-1 bg-teal-900 hover:bg-teal-800 text-teal-200 py-2 rounded-xl text-xs font-medium text-center transition-colors">

}

function SettingsModal({omdbKey, onChange, syncPending, onClearSync, onClose, ghStatus}){
  const [val,setVal]=useState(omdbKey);
  const [copied,setCopied]=useState(false);
  const [tokenVal,setTokenVal]=useState(getToken);
  const [tokenSaved,setTokenSaved]=useState(false);
  function handleSaveToken(){ saveToken(tokenVal); setTokenSaved(true); setTimeout(()=>setTokenSaved(false),2000); }

  function formatForNotion(){
    const movies=syncPending.filter(i=>i.mediaType==='movies');
    const shows=syncPending.filter(i=>i.mediaType==='shows');
    let out='';
    if(movies.length){
      out+='🎥 Películas nuevas:\n';
      movies.forEach(i=>{
        if(i.watched) out+=`${i.title} ${i.rating||''}${i.notes?' — '+i.notes:''}\n`;
        else out+=`${i.title}${i.genre?' ('+i.genre+')':''}\n`;
      });
      out+='\n';
    }
    if(shows.length){
      out+='📺 Series nuevas:\n';
      shows.forEach(i=>{
        if(i.watched) out+=`${i.title} ${i.rating||''}${i.notes?' — '+i.notes:''}\n`;
        else out+=`${i.title}${i.genre?' ('+i.genre+')':''}\n`;
      });
    }
    return out.trim();
  }

  function copyToClipboard(){
    const text=formatForNotion();
    navigator.clipboard.writeText(text).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); });
  }

  return (
    <div className="modal-bg fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box bg-gray-900 border border-gray-800 rounded-2xl p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto">
        <p className="font-bold text-white mb-4">⚙️ Ajustes</p>

        {/* OMDB key */}
        <p className="text-xs font-semibold text-gray-400 mb-1">OMDB API Key</p>
        <p className="text-xs text-gray-600 mb-2">Para ver ratings e info. Gratis en omdbapi.com</p>
        <input value={val} onChange={e=>setVal(e.target.value)} placeholder="Tu OMDB API key..."
          className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:border-violet-500 mb-4"/>

        {/* GitHub sync */}
        <div className="border-t border-gray-800 pt-4 mb-4">
          <p className="text-xs font-semibold text-gray-400 mb-1">GitHub Token</p>
          <p className="text-xs text-gray-600 mb-2">Para guardar cambios desde cualquier dispositivo. Genera uno en github.com/settings/tokens con permiso <span className="text-gray-500 font-mono">repo</span>.</p>
          <div className="flex gap-2">
            <input type="password" value={tokenVal} onChange={e=>setTokenVal(e.target.value)} placeholder="ghp_..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:border-violet-500"/>
            <button onClick={handleSaveToken} className={`px-3 py-2 rounded-xl text-xs font-medium transition-colors ${tokenSaved?'bg-green-800 text-green-300':'bg-violet-800 hover:bg-violet-700 text-violet-200'}`}>{tokenSaved?'✓':'Guardar'}</button>
          </div>
          {ghStatus==='saving'&&<p className="text-xs text-gray-500 mt-2">⏳ Guardando en GitHub...</p>}
          {ghStatus==='saved'&&<p className="text-xs text-green-500 mt-2">✓ Guardado en GitHub</p>}
          {ghStatus==='error'&&<p className="text-xs text-red-500 mt-2">✗ Error al guardar. Verifica el token.</p>}
          {!getToken()&&<p className="text-xs text-yellow-600 mt-2">Sin token: los cambios solo se guardan en este dispositivo.</p>}
        </div>

        <div className="border-t border-gray-800 pt-4 mb-4">
          <p className="text-xs font-semibold text-gray-400 mb-1">GitHub Token</p>
          <div className="flex gap-2">
            <input type="password" value={tokenVal} onChange={e=>setTokenVal(e.target.value)} placeholder="ghp_..." className="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm"/>
            <button onClick={handleSaveToken} className={`px-3 py-2 rounded-xl text-xs font-medium ${tokenSaved?'bg-green-800 text-green-300':'bg-violet-800 text-violet-200'}`}>{tokenSaved?'✓':'Guardar'}</button>
          </div>
          {ghStatus==='saving'&&<p className="text-xs text-gray-500 mt-1">⏳ Guardando...</p>}
          {ghStatus==='saved'&&<p className="text-xs text-green-500 mt-1">✓ Guardado</p>}
          {ghStatus==='error'&&<p className="text-xs text-red-500 mt-1">✗ Error</p>}
        </div>
        {/* Notion sync */}
        <div className="border-t border-gray-800 pt-4">
          <div className="flex items-center justify-between mb-1">
            <p className="text-xs font-semibold text-gray-400">Notion Sync</p>
            {syncPending.length>0&&<span className="text-xs bg-violet-900 text-violet-300 px-2 py-0.5 rounded-full">{syncPending.length} pendientes</span>}
          </div>
          {syncPending.length===0?(
            <p className="text-xs text-gray-600 py-2">✓ Todo sincronizado con Notion</p>
          ):(
            <div>
              <p className="text-xs text-gray-500 mb-2">Estos títulos fueron agregados en la app y aún no están en tu Notion:</p>
              <div className="bg-gray-800 rounded-xl p-3 mb-3 max-h-36 overflow-y-auto space-y-1">
                {syncPending.map((i,idx)=>(
                  <div key={idx} className="flex items-center gap-2">
                    <span className="text-xs text-gray-500">{i.mediaType==='movies'?'🎥':'📺'}</span>
                    <span className="text-xs text-gray-300 flex-1 truncate">{i.title}</span>
                    {i.watched&&<span className="text-xs text-gray-600">{i.rating?.slice(0,4)||'—'}</span>}
                  </div>
                ))}
              </div>
              <div className="flex gap-2">
                <button onClick={copyToClipboard}
                  className={`flex-1 py-2 rounded-xl text-xs font-medium transition-colors ${copied?'bg-green-800 text-green-300':'bg-violet-800 hover:bg-violet-700 text-violet-200'}`}>
                  {copied?'✓ Copiado':'📋 Copiar para Notion'}
                </button>
                <button onClick={()=>{if(confirm('¿Marcar todos como sincronizados?'))onClearSync();}}
                  className="px-3 py-2 rounded-xl text-xs text-gray-500 hover:text-gray-300 bg-gray-800 hover:bg-gray-700 transition-colors">
                  ✓ Sync hecho
                </button>
              </div>
            </div>
          )}
        </div>

        <div className="flex gap-2 mt-4">
          <button onClick={onClose} className="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 rounded-xl text-sm">Cancelar</button>
          <button onClick={()=>{onChange(val);onClose();}} className="flex-1 bg-violet-700 hover:bg-violet-600 text-white py-2 rounded-xl text-sm font-medium">Guardar</button>
        </div>
      </div>
    </div>
  );
}

/* ──────────────────────────────────────────────────────────────
   STATS PAGE
────────────────────────────────────────────────────────────── */
function ratingNum(rating){
  if(!rating) return 0;
  return [...rating.matchAll(/\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu)].length;
}

function StatCard({label,value,sub}){
  return (
    <div className="bg-gray-900 border border-gray-800 rounded-2xl p-4 flex flex-col items-center text-center">
      <p className="text-2xl font-bold text-violet-400">{value}</p>
      <p className="text-xs text-gray-300 mt-0.5">{label}</p>
      {sub&&<p className="text-xs text-gray-700 mt-0.5">{sub}</p>}
    </div>
  );
}

function MiniBar({label,count,max,color}){
  const pct=max>0?Math.round((count/max)*100):0;
  return (
    <div className="flex items-center gap-2 py-0.5">
      <span className="text-xs text-gray-500 w-10 text-right flex-shrink-0">{label}</span>
      <div className="flex-1 h-4 bg-gray-900 rounded overflow-hidden">
        <div className={`h-full ${color} rounded transition-all`} style={{width:`${pct}%`}}/>
      </div>
      <span className="text-xs text-gray-500 w-6 text-right flex-shrink-0">{count}</span>
    </div>
  );
}

function StatsPage({data}){
  const mw=data.movies.watched;
  const sw=data.shows.watched;

  // group by year
  const moviesByYear={};mw.forEach(i=>{const y=i.year||'?';(moviesByYear[y]=moviesByYear[y]||[]).push(i);});
  const showsByYear={};sw.forEach(i=>{const y=i.year||'?';(showsByYear[y]=showsByYear[y]||[]).push(i);});
  const years=[2020,2021,2022,2023,2024,2025,2026].filter(y=>moviesByYear[y]||showsByYear[y]);
  const maxM=Math.max(...years.map(y=>(moviesByYear[y]||[]).length),1);
  const maxS=Math.max(...years.map(y=>(showsByYear[y]||[]).length),1);

  // top rated (5 emojis)
  const top5M=mw.filter(i=>ratingNum(i.rating)===5);
  const top5S=sw.filter(i=>ratingNum(i.rating)===5);

  // avg score (movies watched with rating)
  const rated=mw.filter(i=>i.rating);
  const avgScore=rated.length?Math.round(rated.reduce((s,i)=>s+ratingNum(i.rating),0)/rated.length*10)/10:0;
  const ratedS=sw.filter(i=>i.rating);
  const avgScoreS=ratedS.length?Math.round(ratedS.reduce((s,i)=>s+ratingNum(i.rating),0)/ratedS.length*10)/10:0;

  const scoreDist=[1,2,3,4,5].map(n=>({n,count:mw.filter(i=>ratingNum(i.rating)===n).length}));
  const maxDist=Math.max(...scoreDist.map(d=>d.count),1);
  const scoreDistS=[1,2,3,4,5].map(n=>({n,count:sw.filter(i=>ratingNum(i.rating)===n).length}));
  const maxDistS=Math.max(...scoreDistS.map(d=>d.count),1);

  // genre breakdown (movies to-watch)
  const genreCount={};data.movies.toWatch.forEach(i=>{if(i.genre)(genreCount[i.genre]=(genreCount[i.genre]||0)+1);});
  const genreList=Object.entries(genreCount).sort((a,b)=>b[1]-a[1]);
  const maxG=genreList.length?genreList[0][1]:1;
  const tgm={}; [...mw,...sw].filter(i=>ratingNum(i.rating)>=4).forEach(i=>{if(i.genre)tgm[i.genre]=(tgm[i.genre]||0)+1;});
  const tg=Object.entries(tgm).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([g])=>g);
  const rmovies=data.movies.toWatch.filter(i=>tg.includes(i.genre)).slice(0,5);
  const rshows=data.shows.toWatch.filter(i=>tg.includes(i.genre)).slice(0,5);

  return (
    <div className="pb-20 space-y-6 pt-4">
      {/* overview cards */}
      <div className="grid grid-cols-2 gap-3">
        <StatCard label="Películas vistas" value={mw.length} sub={`${data.movies.toWatch.length} pendientes`}/>
        <StatCard label="Series vistas" value={sw.length} sub={`${data.shows.toWatch.length} pendientes`}/>
        <StatCard label="Score prom. películas" value={`${avgScore} / 5`} sub={`${rated.length} calificadas`}/>
        <StatCard label="Score prom. series" value={`${avgScoreS} / 5`} sub={`${ratedS.length} calificadas`}/>
      </div>

      {/* movies per year */}
      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-4">
        <p className="text-xs font-semibold text-gray-400 mb-3">🎥 Películas por año</p>
        {years.map(y=>(
          <MiniBar key={y} label={y} count={(moviesByYear[y]||[]).length} max={maxM} color="bg-violet-700"/>
        ))}
      </div>

      {/* shows per year */}
      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-4">
        <p className="text-xs font-semibold text-gray-400 mb-3">📺 Series por año</p>
        {years.map(y=>(
          <MiniBar key={y} label={y} count={(showsByYear[y]||[]).length} max={maxS} color="bg-teal-700"/>
        ))}
      </div>

      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-4">
        <p className="text-xs font-semibold text-gray-400 mb-3">⭐️ Scores — películas</p>
        {scoreDist.reverse().map(({n,count})=>(<MiniBar key={n} label={'★'.repeat(n)} count={count} max={maxDist} color={n===5?'bg-violet-600':n===4?'bg-violet-700':n===3?'bg-gray-600':n===2?'bg-gray-700':'bg-gray-800'}/>))}
      </div>
      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-4">
        <p className="text-xs font-semibold text-gray-400 mb-3">⭐️ Scores — series</p>
        {[...scoreDistS].reverse().map(({n,count})=>(<MiniBar key={n} label={'★'.repeat(n)} count={count} max={maxDistS} color={n===5?'bg-teal-600':n===4?'bg-teal-700':n===3?'bg-gray-600':n===2?'bg-gray-700':'bg-gray-800'}/>))}
      </div>

      {/* top movies */}
      {top5M.length>0&&(
        <div className="bg-gray-900 border border-gray-800 rounded-2xl p-4">
          <p className="text-xs font-semibold text-gray-400 mb-3">🏆 Películas 5 estrellas ({top5M.length})</p>
          <div className="space-y-1">
            {top5M.map(i=>(
              <div key={i.id} className="flex items-center gap-2">
                <span className="text-xs text-gray-300 flex-1 truncate">{cleanForSearch(i.title)}</span>
                <span className="text-xs text-gray-600">{i.year}</span>
                <span className="text-xs flex-shrink-0">{i.rating.slice(0,2)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* top shows */}
      {top5S.length>0&&(
        <div className="bg-gray-900 border border-gray-800 rounded-2xl p-4">
          <p className="text-xs font-semibold text-gray-400 mb-3">🏆 Series 5 estrellas ({top5S.length})</p>
          <div className="space-y-1">
            {top5S.map(i=>(
              <div key={i.id} className="flex items-center gap-2">
                <span className="text-xs text-gray-300 flex-1 truncate">{cleanForSearch(i.title)}</span>
                <span className="text-xs text-gray-600">{i.year}</span>
                <span className="text-xs flex-shrink-0">{i.rating.slice(0,2)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* genre breakdown */}
      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-4">
        <p className="text-xs font-semibold text-gray-400 mb-3">🎭 Géneros en lista pendiente (películas)</p>
        {genreList.map(([g,c])=>(
          <MiniBar key={g} label={g} count={c} max={maxG} color="bg-indigo-700"/>
        ))}
      </div>
      {(rmovies.length>0||rshows.length>0)&&(<div className="bg-gray-900 border border-gray-800 rounded-2xl p-4"><p className="text-xs font-semibold text-gray-400 mb-1">✨ Para ver pronto</p><p className="text-xs text-gray-600 mb-2">Géneros favoritos: {tg.join(', ')}</p>{rmovies.length>0&&(<div className="mb-2"><p className="text-xs text-gray-500 mb-1">🎥 Películas</p><div className="space-y-1">{rmovies.map(i=>(<div key={i.id} className="flex items-center gap-2"><span className="text-xs text-gray-300 flex-1 truncate">{i.title}</span>{i.genre&&<span className="text-xs text-gray-700">{i.genre}</span>}</div>))}</div></div>)}{rshows.length>0&&(<div><p className="text-xs text-gray-500 mb-1">📺 Series</p><div className="space-y-1">{rshows.map(i=>(<div key={i.id} className="flex items-center gap-2"><span className="text-xs text-gray-300 flex-1 truncate">{i.title}</span>{i.genre&&<span className="text-xs text-gray-700">{i.genre}</span>}</div>))}</div></div>)}</div>)}
    </div>
  );
}

/* ──────────────────────────────────────────────────────────────
   MODALS
────────────────────────────────────────────────────────────── */
function AddModal({onClose, onSave, onBatchSave, activeTab}){
  const [title,setTitle]=useState('');
  const [genre,setGenre]=useState('');
  const [watched,setWatched]=useState(false);
  const [emoji,setEmoji]=useState('⭐️');
  const [count,setCount]=useState(3);
  const [notes,setNotes]=useState('');
  // screenshot OCR state
  const [imgPreview,setImgPreview]=useState(null);
  const [scanning,setScanning]=useState(false);
  const [suggestions,setSuggestions]=useState([]);
  const [batchItems,setBatchItems]=useState([]); // [{title,selected}]
  const [scanProgress,setScanProgress]=useState('');
  const fileRef=React.useRef();

  const genres=(activeTab==='movies'?MOVIE_GENRES:SHOW_GENRES).slice(1);
  const save=()=>{
    if(!title.trim()) return;
    onSave({id:genId(),title:title.trim(),genre,rating:watched?emoji.repeat(count):'',notes:notes.trim()},watched);
  };

  function extractTitles(text){
    const raw=text.split('\n')
      .map(l=>l.replace(/[|]/g,'I').trim())
      .filter(l=>l.length>2 && /[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]/.test(l) && !/^[\d\s\W]+$/.test(l));
    const seen=new Set();
    return raw.filter(l=>{const k=l.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;}).slice(0,8);
  }

  async function handleScreenshot(e){
    const files=Array.from(e.target.files||[]);
    if(!files.length) return;
    e.target.value='';

    if(files.length===1){
      const url=URL.createObjectURL(files[0]);
      setImgPreview(url);
      setScanning(true);
      setSuggestions([]);
      setBatchItems([]);
      try{
        const result=await Tesseract.recognize(url,['eng','spa'],{logger:()=>{}});
        const deduped=extractTitles(result.data.text);
        setSuggestions(deduped);
        if(deduped.length>0) setTitle(deduped[0]);
      }catch(err){}
      setScanning(false);
    } else {
      setImgPreview(null);
      setSuggestions([]);
      setBatchItems([]);
      setScanning(true);
      const collected=[];
      for(let i=0;i<files.length;i++){
        setScanProgress(`Procesando ${i+1}/${files.length}…`);
        const url=URL.createObjectURL(files[i]);
        try{
          const result=await Tesseract.recognize(url,['eng','spa'],{logger:()=>{}});
          const titles=extractTitles(result.data.text);
          if(titles.length>0) collected.push({title:titles[0],selected:true});
        }catch(err){}
      }
      setScanning(false);
      setScanProgress('');
      setBatchItems(collected);
    }
  }

  function handleBatchSave(){
    const toAdd=batchItems.filter(b=>b.selected&&b.title.trim());
    if(toAdd.length===0) return;
    onBatchSave(toAdd.map(b=>({id:genId(),title:b.title.trim(),genre:'',rating:'',notes:''})));
  }

  return (
    <div className="modal-bg fixed inset-0 bg-black/70 flex items-end sm:items-center justify-center z-50 p-4">
      <div className="modal-box bg-gray-900 border border-gray-800 rounded-2xl p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-bold text-white">{activeTab==='movies'?'🎥 Agregar película':'📺 Agregar serie'}</h2>
          <label className="cursor-pointer flex items-center gap-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg px-2.5 py-1.5 text-xs text-gray-300 transition-colors" title="Subir screenshot">
            📸 Screenshot
            <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={handleScreenshot}/>
          </label>
        </div>

        {/* Image preview + scanning state (single mode) */}
        {imgPreview&&(
          <div className="mb-3">
            <img src={imgPreview} alt="screenshot" className="w-full max-h-40 object-cover rounded-xl mb-2" style={{objectFit:'contain',background:'#111'}}/>
            {scanning&&(
              <div className="flex items-center gap-2 py-2">
                <div className="w-3 h-3 rounded-full bg-violet-500 animate-pulse flex-shrink-0"/>
                <p className="text-xs text-gray-500">Leyendo imagen…</p>
              </div>
            )}
            {!scanning&&suggestions.length>0&&(
              <div>
                <p className="text-xs text-gray-600 mb-1.5">Toca el título detectado:</p>
                <div className="flex flex-wrap gap-1.5">
                  {suggestions.map((s,i)=>(
                    <button key={i} onClick={()=>setTitle(s)}
                      className={`text-xs px-2.5 py-1 rounded-full border transition-colors ${title===s?'bg-violet-800 border-violet-600 text-violet-200':'bg-gray-800 border-gray-700 text-gray-300 hover:border-violet-700 hover:text-white'}`}>
                      {s}
                    </button>
                  ))}
                </div>
              </div>
            )}
            {!scanning&&suggestions.length===0&&<p className="text-xs text-gray-600">No se detectó texto — escríbelo manualmente</p>}
          </div>
        )}

        {/* Batch mode: scanning progress + results */}
        {!imgPreview&&scanning&&(
          <div className="flex items-center gap-2 py-3 mb-2">
            <div className="w-3 h-3 rounded-full bg-violet-500 animate-pulse flex-shrink-0"/>
            <p className="text-xs text-gray-400">{scanProgress||'Procesando…'}</p>
          </div>
        )}
        {!imgPreview&&!scanning&&batchItems.length>0&&(
          <div className="mb-3">
            <p className="text-xs text-gray-500 mb-2">Títulos detectados — selecciona cuáles agregar:</p>
            <div className="flex flex-col gap-1.5 mb-3">
              {batchItems.map((b,i)=>(
                <label key={i} className="flex items-center gap-2.5 cursor-pointer group">
                  <input type="checkbox" checked={b.selected} onChange={ev=>{
                    setBatchItems(prev=>prev.map((x,j)=>j===i?{...x,selected:ev.target.checked}:x));
                  }} className="accent-violet-500 w-4 h-4"/>
                  <input value={b.title} onChange={ev=>{
                    setBatchItems(prev=>prev.map((x,j)=>j===i?{...x,title:ev.target.value}:x));
                  }} className="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-2.5 py-1.5 text-white text-xs focus:border-violet-500"/>
                </label>
              ))}
            </div>
            <button onClick={handleBatchSave}
              disabled={!batchItems.some(b=>b.selected&&b.title.trim())}
              className="w-full bg-violet-700 hover:bg-violet-600 disabled:opacity-40 text-white py-2 rounded-xl text-sm font-medium">
              Agregar {batchItems.filter(b=>b.selected).length} títulos
            </button>
          </div>
        )}

        <div className="flex flex-col gap-3">
          <input autoFocus value={title} onChange={e=>setTitle(e.target.value)} onKeyDown={e=>e.key==='Enter'&&save()}
            placeholder="Título" className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:border-violet-500 w-full"/>
          <select value={genre} onChange={e=>setGenre(e.target.value)}
            className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:border-violet-500">
            <option value="">Sin género</option>
            {genres.map(g=><option key={g} value={g}>{g}</option>)}
          </select>
          <label className="flex items-center gap-2 text-sm text-gray-300 cursor-pointer select-none">
            <div onClick={()=>setWatched(!watched)} className={`w-10 h-5 rounded-full transition-colors flex items-center px-0.5 ${watched?'bg-violet-600':'bg-gray-700'}`}>
              <div className={`w-4 h-4 bg-white rounded-full shadow transition-transform ${watched?'translate-x-5':'translate-x-0'}`}/>
            </div>
            Ya la vi
          </label>
          {watched&&<>
            <div className="flex flex-wrap gap-1.5">
              {RATING_EMOJIS.map(e=>(
                <button key={e} onClick={()=>setEmoji(e)} className={`text-lg p-1 rounded-lg ${emoji===e?'bg-violet-800':'bg-gray-800 hover:bg-gray-700'}`}>{e}</button>
              ))}
            </div>
            <div className="flex gap-1.5">
              {[1,2,3,4,5].map(n=>(
                <button key={n} onClick={()=>setCount(n)} className={`flex-1 py-1 rounded-lg text-sm ${count===n?'bg-violet-700 text-white':'bg-gray-800 text-gray-400'}`}>{n}</button>
              ))}
            </div>
            <p className="text-center text-base">{emoji.repeat(count)}</p>
          </>}
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Notas (opcional)"
            className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:border-violet-500 resize-none h-14"/>
        </div>
        <div className="flex gap-2 mt-4">
          <button onClick={onClose} className="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 rounded-xl text-sm">Cancelar</button>
          <button onClick={save} disabled={!title.trim()} className="flex-1 bg-violet-700 hover:bg-violet-600 disabled:opacity-40 text-white py-2 rounded-xl text-sm font-medium">Guardar</button>
        </div>
      </div>
    </div>
  );
}

function RateModal({item, onClose, onSave}){
  const [emoji,setEmoji]=useState('⭐️');
  const [count,setCount]=useState(3);
  const [notes,setNotes]=useState(item.notes||'');
  useEffect(()=>{
    if(item.rating){
      const segs=[...item.rating.matchAll(/\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu)];
      if(segs.length){ setEmoji(segs[0][0]); setCount(Math.min(segs.length,5)); }
    }
  },[item]);
  return (
    <div className="modal-bg fixed inset-0 bg-black/70 flex items-end sm:items-center justify-center z-50 p-4">
      <div className="modal-box bg-gray-900 border border-gray-800 rounded-2xl p-5 w-full max-w-sm">
        <p className="font-bold text-white text-sm mb-0.5">Calificar</p>
        <p className="text-xs text-gray-400 mb-4 truncate">{item.title}</p>
        <div className="flex flex-wrap gap-1.5 mb-3">
          {RATING_EMOJIS.map(e=>(
            <button key={e} onClick={()=>setEmoji(e)} className={`text-lg p-1 rounded-lg ${emoji===e?'bg-violet-800':'bg-gray-800 hover:bg-gray-700'}`}>{e}</button>
          ))}
        </div>
        <div className="flex gap-1.5 mb-2">
          {[1,2,3,4,5].map(n=>(
            <button key={n} onClick={()=>setCount(n)} className={`flex-1 py-1.5 rounded-lg text-sm ${count===n?'bg-violet-700 text-white':'bg-gray-800 text-gray-400'}`}>{n}</button>
          ))}
        </div>
        <p className="text-center text-base mb-3">{emoji.repeat(count)}</p>
        <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Tu reseña corta..."
          className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:border-violet-500 resize-none h-14 mb-4"/>
        <div className="flex gap-2">
          <button onClick={onClose} className="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 rounded-xl text-sm">Cancelar</button>
          <button onClick={()=>onSave(emoji.repeat(count),notes)} className="flex-1 bg-violet-700 hover:bg-violet-600 text-white py-2 rounded-xl text-sm font-medium">Guardar</button>
        </div>
      </div>
    </div>
  );
}

/* ──────────────────────────────────────────────────────────────
   APP
────────────────────────────────────────────────────────────── */
function App(){
  const [data,setData]=useState(loadData);
  const [tab,setTab]=useState('movies');
  const [view,setView]=useState('toWatch');
  const [search,setSearch]=useState('');
  const [genre,setGenre]=useState('Todos');
  const [sort,setSort]=useState('default');
  const [sort,setSort]=useState('default');
  const [showAdd,setShowAdd]=useState(false);
  const [rateItem,setRateItem]=useState(null);
  const [detailItem,setDetailItem]=useState(null);
  const [showSettings,setShowSettings]=useState(false);
  const [omdbKey,setOmdbKey]=useState(()=>{try{return localStorage.getItem('mel_omdb_key')||'';}catch(e){return '';}});
  const [syncPending,setSyncPending]=useState(loadSync);
  const [ghStatus,setGhStatus]=useState('');
  const [isEditor,setIsEditor]=useState(()=>!!getToken());
  const isFirstRender=React.useRef(true);

  function handleOmdbKey(k){ setOmdbKey(k); try{localStorage.setItem('mel_omdb_key',k);}catch(e){} }
  function addToSync(item, mediaType, watched){
    const entry={...item, mediaType, watched, syncedAt: new Date().toISOString()};
    setSyncPending(p=>{ const n=[...p,entry]; saveSync(n); return n; });
  }
  function clearSync(){ setSyncPending([]); saveSync([]); }

  useEffect(()=>{
    const token=getToken();
    if(!token) return;
    loadFromGitHub().then(d=>{
      if(d){ setData(d); saveData(d); }
      else { const t=getToken(); if(t) pushToGitHub(loadData(),t); }
    });
  },[]);

  useEffect(()=>{
    if(isFirstRender.current){ isFirstRender.current=false; return; }
    saveData(data);
    const token=getToken();
    if(token){
      setGhStatus('saving');
      pushToGitHub(data,token).then(ok=>{
        setGhStatus(ok?'saved':'error');
        setTimeout(()=>setGhStatus(''),4000);
      });
    }
  },[data]);

  const isMovies=tab==='movies';
  const isStats=tab==='stats';
  const genres=isMovies?MOVIE_GENRES:SHOW_GENRES;
  const list=isMovies
    ?(view==='toWatch'?data.movies.toWatch:data.movies.watched)
    :(view==='toWatch'?data.shows.toWatch:data.shows.watched);

  const filtered=useMemo(()=>{
    let arr=list.filter(item=>{
      const ms=!search||item.title.toLowerCase().includes(search.toLowerCase());
      const mg=genre==='Todos'||item.genre===genre;
      return ms&&mg;
    });
    if(sort==='az') arr=[...arr].sort((a,b)=>a.title.localeCompare(b.title));
    else if(sort==='za') arr=[...arr].sort((a,b)=>b.title.localeCompare(a.title));
    else if(sort==='score') arr=[...arr].sort((a,b)=>ratingNum(b.rating)-ratingNum(a.rating));
    return arr;
  },[list,search,genre,sort]);

  // group watched by year descending (only when default sort)
  const yearGroups=useMemo(()=>{
    if(view!=='watched'||sort!=='default') return null;
    const map={};
    filtered.forEach(item=>{const y=item.year||'Sin año';(map[y]=map[y]||[]).push(item);});
    return Object.entries(map).sort((a,b)=>Number(b[0])-Number(a[0]));
  },[filtered,view,sort]);

  useEffect(()=>{setGenre('Todos'); setSort('default');},[tab,view]);

  function handleAddSave(item,watched){
    const key=isMovies?'movies':'shows';
    const sub=watched?'watched':'toWatch';
    setData(p=>({...p,[key]:{...p[key],[sub]:[item,...p[key][sub]]}}));
    addToSync(item, key, watched);
    setShowAdd(false);
  }
  function handleBatchSave(items){
    const key=isMovies?'movies':'shows';
    setData(p=>({...p,[key]:{...p[key],toWatch:[...items,...p[key].toWatch]}}));
    setShowAdd(false);
  }
  function handleRateSave(newRating,newNotes){
    const key=isMovies?'movies':'shows';
    setData(p=>({
      ...p,
      [key]:{
        toWatch:p[key].toWatch.filter(x=>x.id!==rateItem.id),
        watched:[{...rateItem,rating:newRating,notes:newNotes,year:rateItem.year||new Date().getFullYear()},...p[key].watched.filter(x=>x.id!==rateItem.id)]
      }
    }));
    if(view==='toWatch') setView('watched');
    setRateItem(null);
  }
  function handleDelete(id){
    const key=isMovies?'movies':'shows';
    const sub=view==='toWatch'?'toWatch':'watched';
    setData(p=>({...p,[key]:{...p[key],[sub]:p[key][sub].filter(x=>x.id!==id)}}));
  }

  const twCount=isMovies?data.movies.toWatch.length:data.shows.toWatch.length;
  const wCount=isMovies?data.movies.watched.length:data.shows.watched.length;

  return (
    <div className="min-h-screen" style={{background:'#09090f'}}>
      {/* ── HEADER ── */}
      <div className="sticky top-0 z-40 border-b border-gray-900" style={{background:'#09090f'}}>
        <div className="max-w-3xl mx-auto px-4 pt-5 pb-0">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h1 className="text-lg font-bold text-white leading-none mb-1">Mel's Watch List</h1>
              <p className="text-xs text-gray-600">
                🎥 <span className="text-violet-400">{data.movies.watched.length}</span> vistas · <span className="text-gray-500">{data.movies.toWatch.length}</span> pendientes
                &nbsp;·&nbsp;
                📺 <span className="text-violet-400">{data.shows.watched.length}</span> vistas · <span className="text-gray-500">{data.shows.toWatch.length}</span> pendientes
              </p>
            </div>
            <div className="flex items-center gap-2">
              {ghStatus==='saving'&&<span className="text-xs text-gray-500 animate-pulse">⏳</span>}
              {ghStatus==='saved'&&<span className="text-xs text-green-500">✓</span>}
              {ghStatus==='error'&&<span className="text-xs text-red-500">✗</span>}
              <button onClick={()=>setShowSettings(true)} title="Ajustes"
                className="relative text-gray-600 hover:text-gray-400 px-2 py-1.5 rounded-xl text-sm transition-colors">
                ⚙️
                {syncPending.length>0&&<span className="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 bg-violet-500 rounded-full text-white text-center leading-3.5 font-bold" style={{fontSize:'8px',lineHeight:'14px'}}>{syncPending.length}</span>}
              </button>
              {!isEditor&&<span className="text-xs text-gray-700 px-2">👁 Solo vista</span>}
              {!isStats&&isEditor&&<button onClick={()=>setShowAdd(true)}
                className="bg-violet-700 hover:bg-violet-600 text-white px-3 py-1.5 rounded-xl text-sm font-medium transition-colors flex items-center gap-1">
                <span className="text-base leading-none">+</span> Agregar
              </button>}
            </div>
          </div>
          {/* Main tabs */}
          <div className="flex gap-6 border-b border-gray-800">
            {[['movies','🎥 Películas'],['shows','📺 Series'],['stats','📊 Stats']].map(([t,label])=>(
              <button key={t} onClick={()=>{setTab(t);setView('toWatch');setSearch('');}}
                className={`pb-2 text-sm font-medium transition-colors ${tab===t?'tab-active':'text-gray-600 hover:text-gray-300'}`}>
                {label}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-4 pt-4">

        {/* ── STATS PAGE ── */}
        {isStats&&<StatsPage data={data}/>}

        {/* ── MOVIES / SHOWS CONTENT ── */}
        {!isStats&&<>
          {/* Sub-view toggle */}
          <div className="flex gap-2 mb-4">
            {[['toWatch','🔖 Quiero ver',twCount],['watched','✅ Vistas',wCount]].map(([v,label,c])=>(
              <button key={v} onClick={()=>setView(v)}
                className={`px-3 py-1.5 rounded-full text-xs font-medium transition-colors ${view===v?'chip-active text-violet-200':'bg-gray-900 text-gray-500 hover:bg-gray-800'}`}>
                {label} <span className="opacity-60">{c}</span>
              </button>
            ))}
          </div>

          {/* Search */}
          <div className="relative mb-3">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-600 text-xs">🔍</span>
            <input value={search} onChange={e=>setSearch(e.target.value)}
              placeholder={`Buscar ${isMovies?'películas':'series'}...`}
              className="w-full bg-gray-900 border border-gray-800 rounded-xl pl-8 pr-8 py-2 text-sm text-white placeholder-gray-700 focus:border-violet-700"/>
            {search&&<button onClick={()=>setSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-400 text-xs">✕</button>}
          </div>

          {/* Genre chips */}
          <div className="flex gap-1.5 overflow-x-auto scrollbar-hide pb-2 mb-1">
            {genres.map(g=>(
              <button key={g} onClick={()=>setGenre(g)}
                className={`flex-shrink-0 px-2.5 py-1 rounded-full text-xs font-medium transition-colors ${genre===g?'chip-active text-violet-200':'bg-gray-900 text-gray-600 hover:bg-gray-800 hover:text-gray-300'}`}>
                {g}
              </button>
            ))}
          </div>

          {/* Sort chips */}
          <div className="flex gap-1.5 overflow-x-auto scrollbar-hide pb-1 mb-1">
            {[['default',view==='watched'?'📅 Año':'Reciente'],['az','A→Z'],['za','Z→A'],...(view==='watched'?[['score','⭐ Score']]:[])]
              .map(([s,label])=>(
                <button key={s} onClick={()=>setSort(s)}
                  className={`flex-shrink-0 px-2.5 py-1 rounded-full text-xs font-medium transition-colors ${sort===s?'chip-active text-violet-200':'bg-gray-900 text-gray-600 hover:bg-gray-800 hover:text-gray-300'}`}>
                  {label}
                </button>
              ))
            }
          </div>

          <div className="flex gap-1.5 overflow-x-auto scrollbar-hide pb-1 mb-1">
            {[['default',view==='watched'?'📅 Año':'Reciente'],['az','A→Z'],['za','Z→A'],...(view==='watched'?[['score','⭐ Score']]:[])].map(([s,l])=>(<button key={s} onClick={()=>setSort(s)} className={`flex-shrink-0 px-2.5 py-1 rounded-full text-xs font-medium transition-colors ${sort===s?'chip-active text-violet-200':'bg-gray-900 text-gray-600 hover:bg-gray-800'}`}>{l}</button>))}
          </div>
          {/* Result count */}
          <p className="text-xs text-gray-700 px-3 mb-1">
            {filtered.length} {filtered.length===1?'resultado':'resultados'}
            {search&&<> · "<span className="text-gray-500">{search}</span>"</>}
          </p>

          {/* ── LIST ── */}
          {filtered.length===0?(
            <div className="text-center py-16 text-gray-700">
              <div className="text-3xl mb-2">{isMovies?'🎬':'📺'}</div>
              <p className="text-sm">Sin resultados</p>
            </div>
          ) : view==='watched' && !search && genre==='Todos' && yearGroups ? (
            <div className="pb-20">
              {yearGroups.map(([year,items])=>(
                <div key={year}>
                  <YearHeader year={year} count={items.length}/>
                  {items.map(item=>(
                    <Row key={item.id} item={item} isWatched={true} onRate={setRateItem} onDelete={handleDelete} onDetail={setDetailItem} isEditor={isEditor}/>
                  ))}
                </div>
              ))}
            </div>
          ) : (
            <div className="pb-20">
              {view==='watched'&&(search||genre!=='Todos'||sort!=='default')&&(
                <p className="text-xs text-gray-700 px-3 mb-1 italic">
                  {sort==='score'?'Ordenado por score':sort==='az'?'Ordenado A→Z':sort==='za'?'Ordenado Z→A':'Resultados de todos los años'}
                </p>
              )}
              {filtered.map(item=>(
                <Row key={item.id} item={item} isWatched={view==='watched'} onRate={setRateItem} onDelete={handleDelete} onDetail={setDetailItem} isEditor={isEditor}/>
              ))}
            </div>
          )}
        </>}
      </div>

      {showAdd&&<AddModal activeTab={tab} onClose={()=>setShowAdd(false)} onSave={handleAddSave} onBatchSave={handleBatchSave}/>}
      {rateItem&&<RateModal item={rateItem} onClose={()=>setRateItem(null)} onSave={handleRateSave}/>}
      {detailItem&&<DetailPanel item={detailItem} isMovie={isMovies} omdbKey={omdbKey} onClose={()=>setDetailItem(null)}/>}
      {showSettings&&<SettingsModal omdbKey={omdbKey} onChange={handleOmdbKey} syncPending={syncPending} onClearSync={clearSync} onClose={()=>{setShowSettings(false);setIsEditor(!!getToken());}} ghStatus={ghStatus}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
